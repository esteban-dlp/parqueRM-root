services:
  db-init:
    image: alpine:3.20
    container_name: parqueRM-db-init
    volumes:
      - sqlite_data:/data
      - ./db/init:/init:ro
      - ./db/migrations:/migrations:ro
    environment:
      SYSTEM_LAN_URL: "${SYSTEM_LAN_URL:-http://parque.rm.local}"
      SEED_DEMO_DATA: "${SEED_DEMO_DATA:-true}"
    command: >
      /bin/sh -c "
      set -e &&
      apk add --no-cache sqlite &&
      echo 'SQLite listo - ejecutando scripts de inicializacion...' &&
      sqlite3 /data/parquerm.db < /migrations/001_create_schema_migrations.sql &&
      sqlite3 /data/parquerm.db < /init/01_create_database.sql &&
      sqlite3 /data/parquerm.db < /init/02_schema.sql &&
      sqlite3 /data/parquerm.db < /init/03_seed_security.sql &&
      sqlite3 /data/parquerm.db < /init/03a_repair_utf8_seed_text.sql &&
      sqlite3 /data/parquerm.db < /init/04_seed_catalogs.sql &&
      sqlite3 /data/parquerm.db < /init/05_seed_tariffs.sql &&
      sqlite3 /data/parquerm.db < /init/06_seed_park_config.sql &&
      if [ \"$$SEED_DEMO_DATA\" = \"true\" ]; then
        sqlite3 /data/parquerm.db < /init/07_seed_demo_data.sql;
      else
        echo 'Omitiendo datos de ejemplo (SEED_DEMO_DATA=false).';
      fi &&
      sqlite3 /data/parquerm.db < /init/08_patch_park_config_sidebar_color_hex.sql &&
      sqlite3 /data/parquerm.db < /init/09_patch_tickets_and_services.sql &&
      HAS_HEALTH_COL=$$(sqlite3 /data/parquerm.db \"SELECT COUNT(*) FROM pragma_table_info('visitor_records') WHERE name='has_medication_allergy'\") &&
      if [ \"$$HAS_HEALTH_COL\" = \"0\" ]; then
        echo 'Aplicando migracion 004 (campos de salud visitante)...' &&
        sqlite3 /data/parquerm.db < /migrations/004_add_visitor_health_fields.sql;
      else
        sqlite3 /data/parquerm.db \"INSERT OR IGNORE INTO schema_migrations (migration_name) VALUES ('004_add_visitor_health_fields');\" &&
        echo 'Migracion 004: columnas de salud ya presentes.';
      fi &&
      HAS_RESET_PERM=$$(sqlite3 /data/parquerm.db \"SELECT COUNT(*) FROM permissions WHERE code='PLATFORM_DATA_RESET'\") &&
      if [ \"$$HAS_RESET_PERM\" = \"0\" ]; then
        echo 'Aplicando migracion 005 (permiso PLATFORM_DATA_RESET)...' &&
        sqlite3 /data/parquerm.db < /migrations/005_add_platform_data_reset_permission.sql;
      else
        sqlite3 /data/parquerm.db \"INSERT OR IGNORE INTO schema_migrations (migration_name) VALUES ('005_add_platform_data_reset_permission');\" &&
        echo 'Migracion 005: permiso PLATFORM_DATA_RESET ya presente.';
      fi &&
      SYSTEM_LAN_URL_ESCAPED=$$(printf '%s' \"$$SYSTEM_LAN_URL\" | sed \"s/'/''/g\") &&
      sqlite3 /data/parquerm.db \"UPDATE park_config SET system_lan_url = '$$SYSTEM_LAN_URL_ESCAPED', updated_at = CURRENT_TIMESTAMP;\" &&
      echo 'Base SQLite inicializada correctamente.'
      "
    networks:
      - parqueRM-net
    restart: "no"

  backend:
    build:
      context: ../parqueRM-backend
      dockerfile: Dockerfile
    container_name: parqueRM-backend
    environment:
      NODE_ENV: production
      PORT: 3000

      # IMPORTANT: tu backend debe soportar estas variables.
      # En TypeORM usualmente sería type: 'sqlite' y database: DB_PATH.
      DB_TYPE: sqlite
      DB_PATH: /app/data/parquerm.db

      JWT_SECRET: "${JWT_SECRET}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET}"

      UPLOADS_PATH: /app/uploads
    ports:
      - "${BACKEND_PORT}:3000"
    volumes:
      - sqlite_data:/app/data
      - uploads_data:/app/uploads
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - parqueRM-net
    restart: unless-stopped

  frontend:
    build:
      context: ../parqueRM-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL}"
    container_name: parqueRM-frontend
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend
    networks:
      - parqueRM-net
    restart: unless-stopped

volumes:
  sqlite_data:
  uploads_data:

networks:
  parqueRM-net:
    driver: bridge
